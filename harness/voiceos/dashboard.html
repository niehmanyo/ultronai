<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ULTRON // Neural Cortex 3D</title>
<style>
:root{color-scheme:dark;--cyan:#65f2ef;--line:rgba(87,197,227,.18);--dim:#59829b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,#0b2a41 0%,#061623 38%,#020810 78%);color:#e4f7ff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body:before{content:"";position:fixed;inset:0;opacity:.19;background:linear-gradient(transparent 97%,#23506e 100%),linear-gradient(90deg,transparent 97%,#23506e 100%);background-size:80px 80px;mask-image:radial-gradient(ellipse,black 13%,transparent 77%);pointer-events:none}
main{position:relative;width:100vw;height:100vh;min-height:520px;isolation:isolate}
#neural3d{position:absolute;inset:0;width:100%;height:100%;z-index:1}
#coreHalo{position:absolute;z-index:0;top:50%;left:50%;width:min(55vw,530px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(56,249,240,.23),rgba(23,128,192,.11) 27%,transparent 65%);filter:blur(35px);transform:translate(-50%,-50%);opacity:.4;pointer-events:none}
#fallback3d{position:absolute;z-index:1;left:50%;top:50%;transform:translate(-50%,-50%);width:min(60vw,370px);aspect-ratio:1;border-radius:50%;border:2px solid rgba(97,234,232,.55);box-shadow:0 0 55px #197c9a55,inset 0 0 45px #197c9a55}
#fallback3d:after{content:"";position:absolute;inset:10%;border:1px dashed #64dbeb;border-radius:50%}
.top{position:absolute;z-index:3;top:24px;left:35px;right:35px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{font-weight:750;font-size:18px;letter-spacing:.36em;text-shadow:0 0 20px #1597bc}.logo span{color:var(--cyan)}
.info{display:flex;align-items:center;gap:12px;font-size:10px;letter-spacing:.2em;color:#8daabc;font-family:ui-monospace,monospace}.signal{width:7px;height:7px;background:#c36a83;border-radius:100%}.signal.on{background:var(--cyan);box-shadow:0 0 15px var(--cyan)}
.crosshair{position:absolute;z-index:2;top:50%;left:50%;width:94px;height:94px;border:1px solid #5edcda44;border-radius:100%;transform:translate(-50%,-50%);pointer-events:none}
.crosshair:after{content:"";position:absolute;inset:14px;border:1px dashed #4da9bf55;border-radius:50%}
.status{position:absolute;z-index:3;bottom:100px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;text-align:center;pointer-events:none;gap:10px}
.status strong{font-size:13px;letter-spacing:.4em;font-weight:550;color:var(--cyan);text-shadow:0 0 19px #12b9df}.status small{font-size:10px;letter-spacing:.11em;color:#739db4;max-width:50ch}
.footer{position:absolute;bottom:27px;left:35px;right:35px;z-index:3;display:flex;align-items:end;justify-content:space-between;gap:20px}
.metrics{display:flex;gap:25px;align-items:end}.metric{border-left:1px solid #2b6785;padding-left:11px}.metric b{display:block;font-family:ui-monospace,monospace;font-size:16px;font-weight:500;color:#b9f4f2}.metric small{display:block;margin-top:6px;font-size:9px;letter-spacing:.14em;color:#648ba4}
.reply{font-size:11px;color:#8eb2c5;max-width:35%;line-height:1.5;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{position:absolute;z-index:3;right:35px;top:77px;display:flex;gap:9px;align-items:center;font-family:ui-monospace,monospace;letter-spacing:.12em;font-size:9px;color:#6c97af}
.statebar{position:absolute;z-index:3;left:35px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:14px}
.statebar span{display:block;width:5px;height:29px;border-radius:5px;background:#214057;transition:.3s}
.statebar span.active{background:#60f1eb;box-shadow:0 0 13px #59eae1}
@media(max-width:700px){.top{top:18px;left:18px;right:18px}.logo{font-size:14px}.pill{right:18px}.statebar{left:14px}.status{bottom:129px;width:90%}.status strong{font-size:11px}.footer{left:15px;right:15px;bottom:20px;display:block}.metrics{justify-content:space-between;gap:7px}.metric b{font-size:12px}.reply{max-width:100%;margin-top:15px;text-align:left}.info{font-size:9px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>
<main>
<div id="coreHalo"></div><canvas id="neural3d" aria-label="Three dimensional neural core"></canvas><div id="fallback3d" hidden></div><div class="crosshair"></div>
<header class="top"><div class="logo"><span>◇</span> ULTRON</div><div class="info"><span id="signal" class="signal"></span><span id="connection">CONNECTING</span><span id="clock"></span></div></header>
<div class="pill"><span>◈</span> COGNITIVE CORTEX / 3D <span id="tool-label" style="color:#61e6e0;margin-left:12px"></span></div>
<div class="statebar" aria-hidden="true"><span data-step="listening"></span><span data-step="transcribing"></span><span data-step="thinking"></span><span data-step="synthesizing"></span><span data-step="speaking"></span></div>
<div class="status" aria-live="polite"><strong id="status">AWAITING SIGNAL</strong><small id="detail">Local runtime visualization</small></div>
<footer class="footer"><div class="metrics"><div class="metric"><b id="asr">—</b><small>ASR</small></div><div class="metric"><b id="agent">—</b><small>AGENT</small></div><div class="metric"><b id="tts">—</b><small>TTS + PLAY</small></div><div class="metric"><b id="latency">—</b><small>TOTAL</small></div></div><div class="reply" id="reply">VOICEOS / READY</div></footer>
</main>
<script src="/cortex3d.js"></script>
<script>
(()=>{"use strict";const $=id=>document.getElementById(id);
const names={idle:"STANDBY",listening:"LISTENING",transcribing:"RECOGNIZING",thinking:"PROCESSING",synthesizing:"VOICE SYNTHESIS",speaking:"SPEAKING",completed:"READY",error:"SYSTEM ALERT",speech_detected:"VOICE DETECTED"};
let sequence=0,activeTurn=0;function metric(key,value){if(Number.isFinite(value))$(key).textContent=Math.round(value)+" ms"}
function onEvent(e){if(!e||!e.stage)return;
if(e.stage==="tool_event"){
const m=e.metrics||{};if(m.turn!==activeTurn)return;
window.UltronNeural?.updateNetwork(m);
$("tool-label").textContent=(typeof m.tool_name==="string"?m.tool_name.slice(0,30):"TOOL")+" · "+(m.tool_state||"");
return;}
if(e.stage==="audio_level"){if(typeof e.metrics?.level==="number"&&e.metrics.turn===activeTurn)window.UltronNeural?.setLevel(e.metrics.level);return}
if(e.seq<=sequence)return;sequence=e.seq;
const stage=e.stage;const incomingTurn=typeof e.metrics?.turn==="number"?e.metrics.turn:activeTurn;
if(stage==="listening"&&incomingTurn!==activeTurn){window.UltronNeural?.resetNetwork();$("tool-label").textContent=""}
activeTurn=incomingTurn;
$("status").textContent=names[stage]||stage.toUpperCase();$("detail").textContent=(e.detail||"").slice(0,90);
document.querySelectorAll("[data-step]").forEach(x=>x.classList.toggle("active",x.dataset.step===stage));
window.UltronNeural?.setState(stage);
const m=e.metrics||{};metric("asr",m.asr_ms);metric("agent",m.agent_ms);metric("tts",m.tts_ms);metric("latency",m.turn_ms);
if(stage==="completed"&&typeof m.reply==="string")$("reply").textContent=m.reply.slice(0,220)||"Completed";
}
const source=new EventSource("/events");
source.onopen=()=>{$("connection").textContent="LINKED";$("signal").classList.add("on")};
source.onerror=()=>{$("connection").textContent="RECONNECTING";$("signal").classList.remove("on")};
source.onmessage=e=>{try{onEvent(JSON.parse(e.data))}catch(err){console.warn("Event ignored",err)}};
setInterval(()=>$("clock").textContent=new Date().toLocaleTimeString("en-GB",{hour12:false}),1000);
})();
</script></body></html>
